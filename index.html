<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B.Tech Roadmap Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root[data-theme='dark'] {
        --color-bg: #0a0a0a;
        --color-bg-alt: #1f2937;
        --color-text-primary: #ffffff;
        --color-text-secondary: #d1d5db;
        --color-text-muted: #9ca3af;
        --color-primary: #06b6d4; /* cyan-500 */
        --color-primary-light: #22d3ee; /* cyan-400 */
        --color-secondary: #ec4899; /* pink-500 */
        --color-secondary-light: #f472b6; /* pink-400 */
        --color-border: rgba(255, 255, 255, 0.1);
        --color-card-bg: rgba(255, 255, 255, 0.05);
        --color-input-bg: rgba(255, 255, 255, 0.05);
        --color-shadow: rgba(0, 0, 0, 0.2);
        --color-glow-primary: theme('colors.cyan.500');
        --color-glow-secondary: theme('colors.pink.500');
        --color-selection-bg: rgba(6, 182, 212, 0.3);
        --color-success-bg: rgba(74, 222, 128, 0.2);
        --color-success-text: #86efac;
        --color-warning-bg: rgba(234, 179, 8, 0.2);
        --color-warning-text: #fde047;
      }
      :root[data-theme='light'] {
        --color-bg: #f9fafb;
        --color-bg-alt: #ffffff;
        --color-text-primary: #111827;
        --color-text-secondary: #374151;
        --color-text-muted: #6b7280;
        --color-primary: #0891b2; /* cyan-600 */
        --color-primary-light: #06b6d4; /* cyan-500 */
        --color-secondary: #db2777; /* pink-600 */
        --color-secondary-light: #ec4899; /* pink-500 */
        --color-border: rgba(0, 0, 0, 0.1);
        --color-card-bg: rgba(255, 255, 255, 0.7);
        --color-input-bg: rgba(0, 0, 0, 0.03);
        --color-shadow: rgba(0, 0, 0, 0.1);
        --color-glow-primary: theme('colors.cyan.500');
        --color-glow-secondary: theme('colors.pink.600');
        --color-selection-bg: rgba(8, 145, 178, 0.3);
        --color-success-bg: rgba(34, 197, 94, 0.1);
        --color-success-text: #16a34a;
        --color-warning-bg: rgba(202, 138, 4, 0.1);
        --color-warning-text: #ca8a04;
      }
      /* Style dropdown options */
      select option {
        background-color: var(--color-bg-alt);
        color: var(--color-text-primary);
      }
      
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-area, #printable-area * {
          visibility: visible;
        }
        #printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          color: #000 !important;
        }
        .printable-header-only {
          display: block !important;
        }
        header, footer, form, button, #chatbot, #roadmap-actions {
          display: none !important;
        }
        .bg-\[var\(--color-card-bg\)\] {
           background-color: #ffffff !important;
           box-shadow: none !important;
           border: 1px solid #ccc !important;
        }
        .text-\[var\(--color-text-primary\)\] { color: #000 !important; }
        .text-\[var\(--color-text-secondary\)\] { color: #333 !important; }
        .text-\[var\(--color-text-muted\)\] { color: #555 !important; }
        .text-\[var\(--color-primary-light\)\] { color: #0891b2 !important; }
        .text-\[var\(--color-secondary-light\)\] { color: #db2777 !important; }
        a {
            text-decoration: underline !important;
            color: blue !important;
        }
      }

    </style>
    <script>
      // Apply theme based on localStorage before the page renders to prevent FOUC
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = theme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initialTheme);
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text-primary)] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
